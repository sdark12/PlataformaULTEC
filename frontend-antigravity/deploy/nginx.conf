server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html, service worker, or manifest
    location ~* (index\.html|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Cache hashed static assets safely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Servir descargas de APK y archivos con headers adecuados
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "no-cache, must-revalidate";
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
