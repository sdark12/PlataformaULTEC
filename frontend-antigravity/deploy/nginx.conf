server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: If you ever want Nginx to proxy API calls directly
    # location /api/ {
    #     proxy_pass http://ultec-backend:4000/;
    #     proxy_set_header Host $host;
    # }
}
